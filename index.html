<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSWDO Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['DM Sans', 'sans-serif'],
                        serif: ['Fraunces', 'serif']
                    },
                    colors: {
                        forest: {
                            50: '#eaf5ef',
                            100: '#cfe8db',
                            300: '#7dbd9b',
                            500: '#1f7a52',
                            600: '#166241',
                            700: '#124f35',
                            800: '#0e3d29',
                            900: '#092a1c'
                        },
                        gold: {
                            400: '#d3b168',
                            500: '#c19a45'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'DM Sans', sans-serif;
        }
        .font-display {
            font-family: 'Fraunces', serif;
        }
        .seal-ring {
            border: 1px solid rgba(211, 177, 104, 0.35);
        }
    </style>
</head>

<body class="bg-forest-50">

    <div class="min-h-screen flex flex-col md:flex-row">

        <!-- HERO / LEFT SIDE -->
        <div class="relative flex flex-col justify-between overflow-hidden text-white
                    h-56 sm:h-64 md:h-auto md:w-[46%]
                    p-6 sm:p-8 md:p-10">

            <div class="absolute inset-0">
                <img src="mswd.jpg" alt=""
                    class="w-full h-full object-cover object-[center_30%] scale-150">
            </div>

            <div class="absolute inset-0 bg-gradient-to-b from-forest-900/90 via-forest-800/85 to-forest-900/95"></div>


            <div class="relative z-10 hidden md:block">
                <br><br><br><br>

                <h1 class="font-display font-semibold leading-snug text-[2.75rem]">
                    MSWDO San Enrique<br>
                    <span class="text-gold-400">Information System</span>
                </h1>

                <p class="text-sm text-forest-100/85 mt-4">
                    Municipal Social Welfare and Development Office<br>
                    San Enrique, Negros Occidental
                </p>
            </div>

            <div class="relative z-10 md:hidden">
                <h1 class="font-display font-semibold leading-tight text-2xl sm:text-3xl">
                    MSWDO San Enrique
                    <span class="block text-gold-400">Information System</span>
                </h1>

                <p class="text-xs sm:text-sm text-forest-100/85 mt-2 sm:mt-4 max-w-xs">
                    Municipal Social Welfare and Development Office
                    San Enrique, Negros Occidental
                </p>
            </div>

        </div>

        <!-- FORM / RIGHT SIDE -->
        <div class="flex-1 flex items-center justify-center px-6 py-10 sm:px-10 md:px-12">

            <div class="w-full max-w-sm">

                <h2 class="font-display text-2xl sm:text-3xl font-semibold text-forest-900 mb-2">
                    Welcome back
                </h2>

                <p class="text-sm text-forest-700/70 mb-8">
                    Sign in to access the MSWDO portal
                </p>

                <div id="loginError" class="hidden mb-5 px-4 py-3 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm">
                </div>

                <!-- Form -->
                <form action="login.php" method="POST" class="space-y-5">

                    <div>
                        <label class="text-xs font-medium tracking-wide text-forest-700/70">USERNAME</label>
                        <div class="relative mt-1.5">
                            <i class="fas fa-user absolute left-3.5 top-1/2 -translate-y-1/2 text-forest-500/50 text-sm"></i>
                            <input type="text" name="username" placeholder="Enter your username"
                                class="w-full pl-10 pr-4 py-3 rounded-lg bg-white border border-forest-100 text-forest-900 placeholder-forest-300 focus:outline-none focus:ring-2 focus:ring-forest-500/40 focus:border-forest-500 transition">
                        </div>
                    </div>

                    <div>
                        <label class="text-xs font-medium tracking-wide text-forest-700/70">PASSWORD</label>
                        <div class="relative mt-1.5">
                            <i class="fas fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-forest-500/50 text-sm"></i>
                            <input type="password" name="password" id="passwordInput" placeholder="Enter your password"
                                class="w-full pl-10 pr-10 py-3 rounded-lg bg-white border border-forest-100 text-forest-900 placeholder-forest-300 focus:outline-none focus:ring-2 focus:ring-forest-500/40 focus:border-forest-500 transition">
                            <button type="button" id="togglePassword"
                                class="absolute inset-y-0 right-0 flex items-center px-3.5 text-forest-400 hover:text-forest-600">
                                <i class="far fa-eye" id="eyeIcon"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit"
                        class="w-full mt-2 px-4 py-3 rounded-lg bg-forest-700 hover:bg-forest-800 active:bg-forest-900 text-white font-medium transition-colors focus:outline-none focus:ring-2 focus:ring-forest-500/40 focus:ring-offset-2">
                        Sign in
                    </button>

                </form>

            </div>

        </div>

    </div>

    <script>
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('passwordInput');
        const eyeIcon = document.getElementById('eyeIcon');

        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            eyeIcon.classList.toggle('fa-eye');
            eyeIcon.classList.toggle('fa-eye-slash');
        });

        // Show login error messages passed via ?error= from login.php
        const errorMessages = {
            empty: 'Please enter both username and password.',
            invalid: 'Incorrect username or password.',
            disabled: 'This account has been disabled. Please contact your administrator.',
        };
        const params = new URLSearchParams(window.location.search);
        const errorCode = params.get('error');
        if (errorCode && errorMessages[errorCode]) {
            const box = document.getElementById('loginError');
            box.textContent = errorMessages[errorCode];
            box.classList.remove('hidden');
        }
    </script>

</body>

</html>
